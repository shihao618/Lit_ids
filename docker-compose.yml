# LIT API Gateway —— Docker Compose（安全加固版）
# 默认只监听宿主机 127.0.0.1:10381；需要局域网访问可设置 API_BIND=0.0.0.0
services:
  lit-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: "0.1.0"
        # 国内网络慢可设置 PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.org/simple}"
    image: lit-api-gateway:0.1.0
    container_name: lit-api
    env_file:
      - .env
    environment:
      DATA_DIR: /data
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-10381}:10381"
    volumes:
      # 多用户数据：users.json（用户/账号/API Key）+ sessions/（各用户 CAS 会话）+ settings.json
      - ./data:/data
    restart: unless-stopped
    init: true                        # 正确回收子进程 / 转发信号
    read_only: true                   # 根文件系统只读，只有 /data 与 /tmp 可写
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL                           # 非 root + 无需任何 Linux capability
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s            # 后台「重启容器」有足够时间优雅退出
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
